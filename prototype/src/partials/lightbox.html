<dialog class="nh-lightbox" id="nh-lightbox" aria-label="גלריית תמונות">
  <div class="nh-lightbox__inner">
    <div class="nh-lightbox__bar">
      <p class="nh-lightbox__count">תמונה 1 מתוך 6</p>
      <button class="nh-lightbox__btn" type="button" data-lb-close>
        <svg aria-hidden="true" focusable="false"><use href="#i-close"/></svg><span class="nh-sr-only">סגירת הגלריה</span>
      </button>
    </div>
    <div class="nh-lightbox__stage">
      <img alt="">
      <button class="nh-lightbox__btn nh-lightbox__nav nh-lightbox__nav--prev" type="button" data-lb-prev>
        <svg aria-hidden="true" focusable="false"><use href="#i-arrow-back"/></svg><span class="nh-sr-only">התמונה הקודמת</span>
      </button>
      <button class="nh-lightbox__btn nh-lightbox__nav nh-lightbox__nav--next" type="button" data-lb-next>
        <svg aria-hidden="true" focusable="false"><use href="#i-arrow-fwd"/></svg><span class="nh-sr-only">התמונה הבאה</span>
      </button>
    </div>
    <p class="nh-lightbox__caption"></p>
    <p class="nh-sr-only" aria-live="polite" data-lb-live></p>
  </div>
</dialog>
