<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../assets/css/site.css">
<style>body{margin:0;background:#1C1830;color:#F7F1E7}.row{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px}canvas{width:100%;height:820px;display:block;border-radius:24px}</style></head><body>
<div class="row"><canvas id="a"></canvas><canvas id="b"></canvas></div>
<script src="mosaic.js"></script>
<script>
(function(){
  const {Mosaic,cellsFromPaths,IRIS}=NHMosaic;
  const a=new Mosaic(document.getElementById('a'),{seed:3,grout:'#1C1830',radius:0.16}); a.size();
  a.set(cellsFromPaths(a.W,a.H,IRIS,{tile:6,gap:1.6,scale:0.95,field:0.05}),'static'); a.still();
  const b=new Mosaic(document.getElementById('b'),{seed:5,grout:'#EFE8DC',radius:0.16,glaze:0.1}); b.size();
  b.set(cellsFromPaths(b.W,b.H,IRIS,{tile:8,gap:2,scale:0.95,field:0.0}),'static'); b.still();
})();
</script></body></html>
